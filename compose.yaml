# Edge proxy. Its own compose project so no single app owns it:
#   docker compose up -d
name: edge

services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"        # Let's Encrypt verification + redirect to HTTPS
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # certificates live here - keep this volume
      - caddy_config:/config
      - /var/log/caddy:/var/log/caddy
    networks:
      lab-net:
        # containers on lab-net (e.g. eln-server) reach eLabFTW at its public name
        # through Caddy directly: the server's firewall blocks containers from
        # calling back in via its own public IP
        aliases: [ eln.ddomlab.org ]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  caddy_data:
  caddy_config:

networks:
  lab-net:
    # created once on the server: docker network create lab-net
    external: true
