# Edge proxy. Its own compose project so no single app owns it:
#   docker compose up -d
name: edge

services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"        # Let's Encrypt verification + redirect to HTTPS
      - "443:443"
      - "5000:5000"    # compatibility: old PTH address (sensor + MEDUSA)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # certificates live here - keep this volume
      - caddy_config:/config
      - /var/log/caddy:/var/log/caddy
    networks:
      - lab-net
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  caddy_data:
  caddy_config:

networks:
  lab-net:
    # created once on the server: docker network create lab-net
    external: true
